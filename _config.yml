# Central configuration for https://teconas.github.io
# New game: add an entry under `games` and a block under `defaults` (see README.md).

title: teconas
description: Apps & games
author: teconas                     # developer name
owner: teconas (Simon "Max" Detje)  # controller named in privacy policies
email: dev.teconas@gmail.com
lang: en

url: https://teconas.github.io
baseurl: ""
permalink: pretty                   # clean URLs: foo/bar.md -> /foo/bar/

theme: minima

# All games. The landing page and navigation are generated from this list.
# slug = folder name = URL path. draft: true shows the "DRAFT – not final" notice.
games:
  - slug: blitzer-royale
    name: Blitzer Royale
    description: Entirely in German, mainly for mobile. Free, offline, no ads, no tracking.
    play_store: https://play.google.com/store/apps/details?id=com.teconas.blitzerroyale&hl=de
  - slug: ripplebloom
    name: Ripplebloom
    description: A calm tap puzzle on a pond. Throw stones, let the ripples spread and make every water lily bloom.
    draft: true       # TODO: entfernen, wenn Landingpage und Datenschutzerklärung final sind
    # play_store:     # TODO: Play-Store-Link nach Veröffentlichung eintragen

# Layout and game-specific values per folder.
# For the same key, the longer (more specific) path wins.
defaults:
  - scope:
      path: ""
    values:
      layout: game
  - scope:
      path: "*/privacy.md"
    values:
      layout: privacy
  - scope:
      path: blitzer-royale
    values:
      game: blitzer-royale
  - scope:
      path: blitzer-royale/privacy.md
    values:
      lang: de                      # policy text is German
  - scope:
      path: ripplebloom
    values:
      game: ripplebloom

# Not published. This list replaces Jekyll's default excludes, so those are repeated here.
# Otherwise GitHub Pages also renders Markdown without front matter (e.g. /CLAUDE/).
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
